name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - name: Crear archivos del mod
        run: |
          mkdir -p mod && cd mod
          mkdir -p src/main/java/com/gancho
          for d in items models/item textures/item lang; do mkdir -p src/main/resources/assets/gancho/$d; done
          mkdir -p src/main/resources/data/gancho/recipe

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'gancho'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=26.1.2
          loader_version=0.18.5
          loom_version=1.15-SNAPSHOT
          fabric_api_version=0.149.0+26.1.2
          mod_version=1.0.0
          maven_group=com.gancho
          archives_base_name=gancho
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
          }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
          java {
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "gancho",
            "version": "${version}",
            "name": "Gancho",
            "description": "Un gancho para ballestas que te arrastra hasta donde apuntas.",
            "license": "MIT",
            "environment": "*",
            "entrypoints": { "main": ["com.gancho.GanchoMod"] },
            "depends": {
              "fabricloader": ">=0.18.5",
              "minecraft": "~26.1.2",
              "java": ">=25",

            "fabric-api": "*"
            }
          }
          EOF

          cat > src/main/java/com/gancho/GanchoMod.java <<'EOF'
          package com.gancho;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.creativetab.v1.CreativeModeTabEvents;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.fabricmc.fabric.api.event.player.UseItemCallback;
          import net.minecraft.core.Registry;
          import net.minecraft.core.component.DataComponentType;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.network.codec.ByteBufCodecs;
          import net.minecraft.resources.Identifier;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.util.ExtraCodecs;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraft.world.item.CrossbowItem;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;

          public class GanchoMod implements ModInitializer {
              public static final String MOD_ID = "gancho";

              public static Identifier id(String path) {
                  return Identifier.fromNamespaceAndPath(MOD_ID, path);
              }

              public static final DataComponentType<Integer> GRAPPLE_RANGE = Registry.register(
                      BuiltInRegistries.DATA_COMPONENT_TYPE,
                      id("grapple_range"),
                      DataComponentType.<Integer>builder()
