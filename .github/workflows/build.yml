name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - name: Crear archivos del mod
        run: |
          mkdir -p mod && cd mod
          mkdir -p src/main/java/com/gancho
          for d in items models/item textures/item lang; do mkdir -p src/main/resources/assets/gancho/$d; done
          mkdir -p src/main/resources/data/gancho/recipe
          mkdir -p src/main/resources/data/minecraft/tags/item

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'gancho'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=26.1.2
          loader_version=0.18.5
          loom_version=1.15-SNAPSHOT
          fabric_api_version=0.149.0+26.1.2
          mod_version=1.0.0
          maven_group=com.gancho
          archives_base_name=gancho
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
          }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
          java {
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "gancho",
            "version": "${version}",
            "name": "Gancho",
            "description": "Un gancho para ballestas que te arrastra hasta donde apuntas.",
            "license": "MIT",
            "environment": "*",
            "entrypoints": { "main": ["com.gancho.GanchoMod"] },
            "depends": {
              "fabricloader": ">=0.18.5",
              "minecraft": "~26.1.2",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          EOF

          cat > src/main/java/com/gancho/GanchoMod.java <<'EOF'
          package com.gancho;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.creativetab.v1.CreativeModeTabEvents;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.fabricmc.fabric.api.event.player.UseItemCallback;
          import net.minecraft.core.Registry;
          import net.minecraft.core.component.DataComponents;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.resources.Identifier;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.item.component.ChargedProjectiles;

          public class GanchoMod implements ModInitializer {
              public static final String MOD_ID = "gancho";

              /** Alcance (en bloques) del gancho con 1 a 8 cuerdas. */
              public static final int[] RANGES = {20, 40, 60, 100, 120, 140, 160, 200};

              public static Identifier id(String path) {
                  return Identifier.fromNamespaceAndPath(MOD_ID, path);
              }

              public static final Item GRAPPLING_HOOK = registerItem("grappling_hook");
              public static final Item[] ROPED_HOOKS = createRopedHooks();

              private static Item[] createRopedHooks() {
                  Item[] items = new Item[RANGES.length];
                  for (int i = 0; i < items.length; i++) {
                      items[i] = registerItem("roped_hook_" + (i + 1));
                  }
                  return items;
              }

              private static Item registerItem(String name) {
                  ResourceKey<Item> key = ResourceKey.create(Registries.ITEM, id(name));
                  Item item = new Item(new Item.Properties().setId(key).stacksTo(1));
                  return Registry.register(BuiltInRegistries.ITEM, key, item);
              }

              /** Devuelve qué gancho con cuerda tiene cargada la ballesta, o -1 si ninguno. */
              public static int hookIndex(ChargedProjectiles charged) {
                  for (int i = 0; i < ROPED_HOOKS.length; i++) {
                      if (charged.contains(ROPED_HOOKS[i])) return i;
                  }
                  return -1;
              }

              @Override
              public void onInitialize() {
                  CreativeModeTabEvents.modifyOutputEvent(CreativeModeTabs.TOOLS_AND_UTILITIES)
                          .register(output -> output.accept(GRAPPLING_HOOK));

                  UseItemCallback.EVENT.register((player, level, hand) -> {
                      ItemStack stack = player.getItemInHand(hand);
                      if (!stack.is(Items.CROSSBOW)) {
                          return InteractionResult.PASS;
                      }
                      ChargedProjectiles charged = stack.get(DataComponents.CHARGED_PROJECTILES);
                      if (charged == null || charged.isEmpty()) {
                          return InteractionResult.PASS;
                      }
                      int index = hookIndex(charged);
                      if (index < 0) {
                          return InteractionResult.PASS;
                      }
                      if (level instanceof ServerLevel serverLevel && player instanceof ServerPlayer serverPlayer) {
                          GrappleManager.fire(serverPlayer, serverLevel, stack, hand, RANGES[index], ROPED_HOOKS[index]);
                      }
                      return InteractionResult.SUCCESS;
                  });

                  ServerTickEvents.END_SERVER_TICK.register(GrappleManager::tick);
              }
          }
          EOF

          cat > src/main/java/com/gancho/GrappleManager.java <<'EOF'
          package com.gancho;

          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.Map;
          import java.util.UUID;

          import net.minecraft.core.component.DataComponents;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.component.ChargedProjectiles;
          import net.minecraft.world.level.ClipContext;
          import net.minecraft.world.phys.BlockHitResult;
          import net.minecraft.world.phys.HitResult;
          import net.minecraft.world.phys.Vec3;

          public final class GrappleManager {
              private static final double SPEED = 1.6;
              private static final double STOP_DISTANCE = 2.0;

              private static final class Pull {
                  final Vec3 target;
                  int ticksLeft;
                  Pull(Vec3 target, int ticksLeft) {
                      this.target = target;
                      this.ticksLeft = ticksLeft;
                  }
              }

              private static final Map<UUID, Pull> PULLS = new HashMap<>();

              private GrappleManager() {}

              public static void fire(ServerPlayer player, ServerLevel level, ItemStack crossbow,
                                      InteractionHand hand, int range, Item hookItem) {
                  Vec3 start = player.getEyePosition();
                  Vec3 end = start.add(player.getLookAngle().scale(range));
                  BlockHitResult hit = level.clip(new ClipContext(start, end,
                          ClipContext.Block.COLLIDER, ClipContext.Fluid.NONE, player));

                  if (hit.getType() != HitResult.Type.BLOCK) {
                      level.playSound(null, player.getX(), player.getY(), player.getZ(),
                              SoundEvents.CROSSBOW_LOADING_END.value(), SoundSource.PLAYERS, 0.6F, 0.6F);
                      player.sendOverlayMessage(Component.translatable("message.gancho.no_target", range));
                      return;
                  }

                  Vec3 target = hit.getLocation();

                  // El gancho sale de la ballesta y se devuelve al jugador
                  crossbow.set(DataComponents.CHARGED_PROJECTILES, ChargedProjectiles.EMPTY);
                  if (!player.isCreative()) {
                      ItemStack back = new ItemStack(hookItem);
                      if (!player.getInventory().add(back)) {
                          player.drop(back, false);
                      }
                  }
                  crossbow.hurtAndBreak(1, player,
                          hand == InteractionHand.MAIN_HAND ? EquipmentSlot.MAINHAND : EquipmentSlot.OFFHAND);

                  level.playSound(null, player.getX(), player.getY(), player.getZ(),
                          SoundEvents.CROSSBOW_SHOOT, SoundSource.PLAYERS, 1.0F, 0.8F);

                  Vec3 dir = target.subtract(start);
                  double dist = dir.length();
                  double step = Math.max(1.0, dist / 60.0);
                  Vec3 unit = dir.scale(1.0 / dist);
                  for (double d = 1.0; d < dist; d += step) {
                      Vec3 p = start.add(unit.scale(d));
                      level.sendParticles(ParticleTypes.CRIT, p.x, p.y, p.z, 1, 0, 0, 0, 0);
                  }

                  int maxTicks = (int) Math.ceil(dist / SPEED) * 2 + 20;
                  PULLS.put(player.getUUID(), new Pull(target, maxTicks));
              }

              public static void tick(MinecraftServer server) {
                  Iterator<Map.Entry<UUID, Pull>> it = PULLS.entrySet().iterator();
                  while (it.hasNext()) {
                      Map.Entry<UUID, Pull> entry = it.next();
                      ServerPlayer player = server.getPlayerList().getPlayer(entry.getKey());
                      Pull pull = entry.getValue();

                      if (player == null || !player.isAlive()) {
                          it.remove();
                          continue;
                      }

                      Vec3 pos = player.position().add(0, player.getBbHeight() * 0.5, 0);
                      Vec3 diff = pull.target.subtract(pos);
                      double dist = diff.length();

                      if (dist < STOP_DISTANCE || --pull.ticksLeft <= 0 || player.isShiftKeyDown()) {
                          player.setDeltaMovement(player.getDeltaMovement().scale(0.3));
                          player.hurtMarked = true;
                          player.resetFallDistance();
                          it.remove();
                          continue;
                      }

                      double speed = Math.min(SPEED, dist * 0.6);
                      player.setDeltaMovement(diff.scale(speed / dist));
                      player.hurtMarked = true;
                      player.resetFallDistance();
                  }
              }
          }
          EOF

          cat > src/main/resources/data/gancho/recipe/grappling_hook.json <<'EOF'
          {
            "type": "minecraft:crafting_shaped",
            "category": "equipment",
            "pattern": [" I ", "ISI", " S "],
            "key": { "I": "minecraft:iron_ingot", "S": "minecraft:stick" },
            "result": { "id": "gancho:grappling_hook", "count": 1 }
          }
          EOF

          python3 - <<'EOF'
          import json, zlib, struct
          ranges = [20, 40, 60, 100, 120, 140, 160, 200]

          # Recetas: gancho + N cuerdas
          for n, r in enumerate(ranges, start=1):
              d = {"type": "minecraft:crafting_shapeless", "category": "equipment",
                   "ingredients": ["gancho:grappling_hook"] + ["minecraft:string"] * n,
                   "result": {"id": f"gancho:roped_hook_{n}", "count": 1}}
              json.dump(d, open(f"src/main/resources/data/gancho/recipe/roped_hook_{n}.json", "w"), indent=2)

          # Los ganchos con cuerda cuentan como flechas para la ballesta
          json.dump({"values": [f"gancho:roped_hook_{n}" for n in range(1, 9)]},
                    open("src/main/resources/data/minecraft/tags/item/arrows.json", "w"), indent=2)

          # Modelos de ítem
          def model(item, tex):
              json.dump({"model": {"type": "minecraft:model", "model": f"gancho:item/{item}"}},
                        open(f"src/main/resources/assets/gancho/items/{item}.json", "w"))
              json.dump({"parent": "minecraft:item/generated", "textures": {"layer0": f"gancho:item/{tex}"}},
                        open(f"src/main/resources/assets/gancho/models/item/{item}.json", "w"))
          model("grappling_hook", "grappling_hook")
          for n in range(1, 9):
              model(f"roped_hook_{n}", "roped_hook")

          # Textos
          lang_es = {"item.gancho.grappling_hook": "Gancho",
                     "message.gancho.no_target": "No hay ninguna superficie a menos de %s bloques"}
          lang_en = {"item.gancho.grappling_hook": "Grappling Hook",
                     "message.gancho.no_target": "No surface within %s blocks"}
          for n, r in enumerate(ranges, start=1):
              lang_es[f"item.gancho.roped_hook_{n}"] = f"Gancho con {n} cuerda{'s' if n > 1 else ''} ({r} bloques)"
              lang_en[f"item.gancho.roped_hook_{n}"] = f"Grappling Hook with {n} rope{'s' if n > 1 else ''} ({r} blocks)"
          for name, data in [("es_es", lang_es), ("es_mx", lang_es), ("en_us", lang_en)]:
              json.dump(data, open(f"src/main/resources/assets/gancho/lang/{name}.json", "w"), ensure_ascii=False, indent=2)

          # Texturas 16x16
          def png(path, px):
              raw = b''
              for y in range(16):
                  raw += b'\x00'
                  for x in range(16):
                      raw += bytes(px.get((x, y), (0, 0, 0, 0)))
              def ch(t, d):
                  c = struct.pack('>I', len(d)) + t + d
                  return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              open(path, 'wb').write(b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', 16, 16, 8, 6, 0, 0, 0)) + ch(b'IDAT', zlib.compress(raw)) + ch(b'IEND', b''))

          brown = (120, 80, 40, 255); iron = (200, 200, 205, 255); dark = (110, 110, 120, 255)
          rope = (205, 175, 110, 255); ropeD = (160, 130, 80, 255)
          def base():
              px = {}
              for i in range(7): px[(3 + i, 13 - i)] = brown
              for p in [(9,6),(10,5),(11,4),(12,3),(13,3),(14,4),(14,5),(13,6),(12,6)]: px[p] = iron
              for p in [(10,6),(11,5),(12,4),(13,4)]: px[p] = dark
              return px
          png('src/main/resources/assets/gancho/textures/item/grappling_hook.png', base())
          px = base()
          for i, p in enumerate([(2,9),(3,9),(4,9),(2,10),(5,10),(2,11),(5,11),(3,12),(4,12)]): px[p] = rope if i % 2 == 0 else ropeD
          for p in [(5,9),(6,9),(7,8)]: px[p] = rope
          png('src/main/resources/assets/gancho/textures/item/roped_hook.png', px)
          EOF
      - name: Compilar
        working-directory: mod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: gancho-mod
          path: mod/build/libs/*.jar
